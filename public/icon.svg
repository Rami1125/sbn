<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#072244"/>
      <stop offset="50%" stop-color="#0F3E7A"/>
      <stop offset="100%" stop-color="#1959A8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe-zone margin -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle luxury border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Iconic Building Blocks / Construction Tower Geometry -->
  <g filter="url(#shadow)" transform="translate(256, 230)">
    
    <!-- Central Tower Beam (Saban 'S' & Building Monogram) -->
    <!-- Base Foundation Block -->
    <path d="M-110,95 L110,95 L85,135 L-85,135 Z" fill="url(#goldGrad)"/>
    
    <!-- Geometric Cranes / Steel Truss Architecture -->
    <path d="M-80,80 L-20,-90 L20,-90 L80,80 L40,80 L0,-20 L-40,80 Z" fill="#FFFFFF"/>
    
    <!-- Gold Keystone Diamond -->
    <polygon points="0,-120 45,-65 0,-10 -45,-65" fill="url(#goldGrad)"/>
    
    <!-- Heavy Duty Crane Hook / Arch -->
    <circle cx="0" cy="-65" r="14" fill="#0F3E7A"/>
  </g>

  <!-- Saban Signature Brand Text -->
  <text x="256" y="420" font-family="'Heebo', 'Assistant', sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    ח. סבן
  </text>
  <text x="256" y="455" font-family="'Heebo', 'Assistant', sans-serif" font-weight="700" font-size="20" fill="#FBBF24" text-anchor="middle" letter-spacing="3">
    חומרי בניין (1994) בע״מ
  </text>
</svg>
